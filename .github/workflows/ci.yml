name: Backend 2 CI + SonarQube

on:
  push:
    branches:
      - main
      - develop
      - despliegue
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Verify coverage report
        run: |
          echo "Coverage file path: ${{ github.workspace }}/coverage/lcov.info"
          ls -lh ${{ github.workspace }}/coverage/lcov.info
          head -5 ${{ github.workspace }}/coverage/lcov.info

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=${{ github.workspace }}/coverage/lcov.info
